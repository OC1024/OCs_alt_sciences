[mod-name]
title=OCs Alternative Wissenschaftspaketproduktion

[mod-description]
description=Gieße, biologiesiere, elektromagnetisiere und kryorisiere die nicht-Planet-spezifischen Wissenschaftspakete in den dazugeörigen Maschinen.


[recipe-name]
casting-automation-science-pack=Gieße Wissenschaftspaket für Automatisierung
casting-logistic-science-pack=Gieße Wissenschaftspaket für Logistik
casting-military-science-pack=Gieße Wissenschaftspaket für Militär
lava-to-military-science-pack=Gieße Wissenschaftspaket für Militär aus Lava
casting-production-science-pack=Gieße Wissenschaftspaket für Produktion
em-production-science-pack=Elektromagnetisiere Wissenschaftspaket für Produktion
em-utility-science-pack=Elektromagnetisiere Wissenschaftspaket für Zubehör
biochamber-chemical-science-pack=Biologisieren Wissenschaftspaket für Chemie
biochamber-space-science-pack=Biologisieren Wissenschaftspaket für Weltraum

[technology-name]
foundry-science-packs-tech=Gießen von Wissenschaftspaketen
emp-science-packs-tech=Elektromagnetisieren von Wissenschaftspaketen
biochamber-science-packs-tech=Biologisieren von Wissenschaftspaketen
cryoplant-science-packs-tech=Kryorisieren von Wissenschaftspaketen

foundry-science-packs-productivity-tech=Bonus auf Gießen von Wissenschaftspaketen
emp-science-packs-productivity-tech=Bonus auf EMen von Wissenschaftspaketen
biochamber-science-packs-productivity-tech=Bonus auf Biologisieren von Wissenschaftspaketen
cryoplant-science-packs-productivity-tech=Bonus auf Kryorisieren von Wissenschaftspaketen


[technology-description]
foundry-science-packs-tech=Schaltet das Gießen von Wissenschaftspaketen frei. Weniger komplex aber zum selben Preis. Die geringere Komplexität geht aber auch auf Kosten der möglichen Effizienzsteigung durch Module.
emp-science-packs-tech=Schaltet das EMen von Wissenschaftspaketen frei. Weniger komplex aber zum selben Preis. Die geringere Komplexität geht aber auch auf Kosten der möglichen Effizienzsteigung durch Module.
biochamber-science-packs-tech=Schaltet das Biologisieren von Wissenschaftspaketen frei. Genau so komplex und zum selben Preis.
foundry-science-packs-productivity-tech=Erhöht den Ertrag aus der Herstellung der Wissenschaftspaketen, die in der Gießerei hergestellt werden.
emp-science-packs-productivity-tech=Erhöht den Ertrag aus der Herstellung der Wissenschaftspaketen, die in der EM Fabrik hergestellt werden.
biochamber-science-packs-productivity-tech=Erhöht den Ertrag aus der Herstellung der Wissenschaftspaketen, die in der Biokammer hergestellt werden.

[mod-setting-name]
allow-planetary-sci-productivity=Produktivitätsbonus zusätzlich auch für die Planet-spezifischen Forschungspakete.
science-productivity-max-level=Maximale Stufe der Wissenschaftspaket-Produktivitätsbonus-Forschung

[mod-setting-description]
allow-planetary-sci-productivity=Zum Beispiel für Metallurgie
science-productivity-max-level="-1" bedeutet unendlich, "0" deaktiviert es und jede positive Zahl ist die maximale Stufe.