[mod-name]
OCs_alt_sciences=OCs Alternative Wissenschaftspaketproduktion

[mod-description]
OCs_alt_sciences=Fügt die nicht-planetenspezifischen Wissenschaftspaketrezepte der Gießerei, EM-Fabrik und Biokammer hinzu. Diese lassen oft Zwischenschritte aus.


