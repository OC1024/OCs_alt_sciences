cryoplant-science-packs-productivity-tech=Bonus auf Kryogenisieren von Wissenschaftspaketen


[technology-description]
foundry-science-packs-tech=Schaltet das Gießen von Wissenschaftspaketen frei. Weniger komplex aber zum selben Preis. Die geringere Komplexität geht aber auch auf Kosten der möglichen Effizienzsteigung durch Module.
emp-science-packs-tech=Schaltet das Elektromagnetisieren von Wissenschaftspaketen frei. Weniger komplex aber zum selben Preis. Die geringere Komplexität geht aber auch auf Kosten der möglichen Effizienzsteigung durch Module.
biochamber-science-packs-tech=Schaltet das Biologisieren von Wissenschaftspaketen frei. Genauso komplex und zum selben Preis.
foundry-science-packs-productivity-tech=Erhöht den Ertrag aus der Herstellung der Wissenschaftspakete, die in der Gießerei hergestellt werden.
emp-science-packs-productivity-tech=Erhöht den Ertrag aus der Herstellung der Wissenschaftspakete, die in der EM Fabrik hergestellt werden.
biochamber-science-packs-productivity-tech=Erhöht den Ertrag aus der Herstellung der Wissenschaftspakete, die in der Biokammer hergestellt werden.

[mod-setting-name]
allow-planetary-sci-productivity=Produktivitätsbonus zusätzlich auch für die Planet-spezifischen Forschungspakete.
science-productivity-max-level=Maximale Stufe der Wissenschaftspaket-Produktivitätsbonus-Forschung
legacy-recipes=Aktiviere Legacy-Rezepte vor der 0.2.0
experimental-recipes=Probiere die experimentellen, automatisch generierten Rezepte aus.
science-productivity-bonus-per-level=Produktivitätsbonus pro Stufe für die alternativen Rezepte der Wissenschaftspakete (in %)
alt-sci-easy-mode=Vereinfachte Technologiekosten-Skalierung

[mod-setting-description]
allow-planetary-sci-productivity=Betroffene Rezepte: Metallurgisches, Landwirtschaftliches, Elektromagnetisches, Kryogenik-, Promethium-Wissenschaftspaket
science-productivity-max-level="-1" bedeutet unendlich, "0" deaktiviert es und jede positive Zahl ist die maximale Stufe.
legacy-recipes=Die alten Rezepte waren händisch hergestellt, die neuen sind automatisiert und oft kompatibler zu anderen Mods.
experimental-recipes=Die Standard-Rezepte sind händisch hergestellt, die neuen sind automatisiert und oft kompatibler zu anderen Mods.
science-productivity-bonus-per-level=Wähle 10 % für den einfachen Modus.
alt-sci-easy-mode=Wenn aktiviert, skaliert die Technologie mit der Basis von 2 (statt Wurzel(2), und erwirtschaftet +10 % (statt +5 %) Bonus pro Level. Das ist etwa 41 % billiger.


