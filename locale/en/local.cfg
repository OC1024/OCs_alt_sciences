[mod-name]
title=OCs alternative science pack production

[mod-description]
description=Add the non-Planet specific science pack recipes to the foundry, em-plant, and biochamber.


[recipe-name]
oc-casting-automation-science-pack=Cast automation science pack
oc-casting-logistic-science-pack=Cast logistic science pack
oc-casting-military-science-pack=Cast military science pack
oc-lava-to-military-science-pack=Cast military science pack from lava
oc-casting-production-science-pack=Cast production science pack
oc-lava-to-production-science-pack=Cast production science pack from lava
oc-pulse-utility-science-pack=Pulse utility science pack
oc-pulse-production-science-pack=Pulse production science pack
oc-bio-chemical-science-pack=Bio chemical science pack
oc-bio-space-science-pack=Bio space science pack

[technology-name]
foundry-science-packs-tech=Casting science packs
emp-science-packs-tech=Electromagnetizing of science packs
biochamber-science-packs-tech=Biologising of science packs
cryoplant-science-packs-tech=Cryoplanting of science packs

foundry-science-packs-productivity-tech=Bonus to foundry science packs
emp-science-packs-productivity-tech=Bonus to EM-plant science packs
biochamber-science-packs-productivity-tech=Bonus to biochamber science packs
cryoplant-science-packs-productivity-tech=Bonus to cryoplant science packs


[technology-description]
foundry-science-packs-tech=Unlocks casting four of the science packs in the foundry. It's less complex but it costs the same.
emp-science-packs-tech=Unlocks EMing one of the science packs in the EM plant. It's less complex but it costs the same.
biochamber-science-packs-tech=Unlocks biologising four of the science packs in the biochamberer. It's less complex but it costs the same.
foundry-science-packs-productivity-tech=Increase the productivity when using the foundry science packs recipes.
emp-science-packs-productivity-tech=Increase the productivity when using the EM plant science packs recipes.
biochamber-science-packs-productivity-tech=Increase the productivity when using the biochamber science packs recipes.

[mod-setting-name]
allow-planetary-sci-productivity=Productivity bonus including the planet-specific science packs.
science-productivity-max-level=Max level of science pack productivity research
legacy-recipes=Activate legacy recipes from pre-0.2.0
experimental-recipes=Try out experimental, automatic generated recipes.

[mod-setting-description]
allow-planetary-sci-productivity=Affected recipes: metallurgic, agricultural, electromagnetic, cryogenic, prometium sciece pack
science-productivity-max-level="-1" means infinite, "0" disables it and any positive value is just the max level.
legacy-recipes=The old ones were manually created, the new ones are created automatically and are often more compatible to other mods.
experimental-recipes=The standard ones are manually created, the new ones are created automatically and are often more compatible to other mods.
